# Verify keys against the GraphRAG version installed in your uv environment.
# Ollama is accessed through LiteLLM. Local models must support reliable structured JSON output.
models:
  default_chat_model:
    type: litellm
    model_provider: ollama
    model: ${OLLAMA_CHAT_MODEL}
    api_base: ${OLLAMA_API_BASE}
    api_key: ${GRAPHRAG_API_KEY}
    call_args:
      temperature: 0.0
  default_embedding_model:
    type: litellm
    model_provider: ollama
    model: ${OLLAMA_EMBED_MODEL}
    api_base: ${OLLAMA_API_BASE}
    api_key: ${GRAPHRAG_API_KEY}

input:
  type: file
  file_type: text
  base_dir: input
  file_pattern: ".*\\.txt$"
  encoding: utf-8

chunks:
  size: 800
  overlap: 100
  group_by_columns: [id]

output:
  type: file
  base_dir: output/no_fibo
cache:
  type: file
  base_dir: cache/no_fibo
reporting:
  type: file
  base_dir: logs/no_fibo

embed_text:
  embedding_model_id: default_embedding_model
  batch_size: 8

extract_graph:
  completion_model_id: default_chat_model
  prompt: prompts/extract_graph_no_fibo.txt
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: default_chat_model

community_reports:
  graph_prompt: prompts/community_report_graph.txt
  text_prompt: prompts/community_report_text.txt
  completion_model_id: default_chat_model
  max_length: 1500

embed_graph:
  embedding_model_id: default_embedding_model

# Default query configuration can be used after successful indexing.
# GraphRAG CLI command names/options may differ between versions; use `graphrag --help`.
