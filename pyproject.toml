dependencies = [
  "graphrag>=2.0.0",
  "rdflib>=7.0.0",
  "rapidfuzz>=3.6.0",
  "pandas>=2.0.0",
  "python-dotenv>=1.0.0",
  "pyarrow>=15.0.0",
]

[tool.uv]
package = false
